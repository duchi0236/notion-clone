<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>无法连接</title>
<style>
  :root { --bg:#f6f7f9; --surface:#fff; --border:#e3e6eb; --text:#0f172a; --muted:#64748b; --faint:#94a3b8; --primary:#0f172a; --danger:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-user-select:none; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { max-width:440px; text-align:center; padding:40px 32px; }
  .icon { width:64px; height:64px; border-radius:50%; background:#fdecec; color:var(--danger); display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 18px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 6px; }
  .target { font-size:12px; color:var(--faint); word-break:break-all; margin-bottom:24px; }
  .actions { display:flex; gap:10px; justify-content:center; }
  button.primary { padding:11px 22px; border:none; border-radius:10px; background:var(--primary); color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  button.ghost { padding:11px 22px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); font-size:14px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>无法连接到 ClawNote</h1>
    <p id="msg">请确认服务器正在运行，且地址可访问。</p>
    <div class="target" id="target"></div>
    <div class="actions">
      <button class="ghost" onclick="window.clawnoteHost.openSettings()">服务器设置</button>
      <button class="primary" onclick="window.clawnoteHost.retry()">重试</button>
    </div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  const msg = p.get("message");
  const target = p.get("target");
  if (msg) document.getElementById("msg").textContent = msg;
  if (target) document.getElementById("target").textContent = target;
</script>
</body>
</html>
