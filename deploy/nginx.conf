worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  map $upstream_http_referrer_policy $clawnote_referrer_policy {
    '' strict-origin-when-cross-origin;
    default $upstream_http_referrer_policy;
  }

  # Keep OAuth codes and state out of callback access logs.
  map $uri $clawnote_logged_request {
    /api/auth/wechat/callback "$request_method $uri $server_protocol";
    default $request;
  }

  log_format clawnote '$remote_addr - $remote_user [$time_local] "$clawnote_logged_request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log clawnote;

  upstream clawnote_app {
    server app:3000;
  }

  upstream clawnote_collab {
    server collab:1234;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy $clawnote_referrer_policy;

    # Realtime collaboration websocket (set NEXT_PUBLIC_COLLAB_WS=wss://<domain>/collab)
    location /collab/ {
      rewrite ^/collab/(.*)$ /$1 break;
      proxy_pass http://clawnote_collab;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://clawnote_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
